# Synthetic local-only wiring; never deploy this vulnerable lab publicly.
{
  "name": "cr-multirepo-lab",
  "services": {
    "gateway": {
      "build": {
        "context": "."
      },
      "ports": [
        "127.0.0.1:18080:5000"
      ],
      "environment": {
        "ARCHIVES_URL": "http://archives:5000",
        "FETCH_URL": "http://fetch:5000",
        "FILES_URL": "http://files:5000",
        "IDENTITY_URL": "http://identity:5000",
        "JOBS_URL": "http://jobs:5000",
        "ORDERS_URL": "http://orders:5000",
        "REDIRECTS_URL": "http://redirects:5000",
        "SEARCH_URL": "http://search:5000",
        "TEMPLATES_URL": "http://templates:5000"
      },
      "depends_on": [
        "archives",
        "fetch",
        "files",
        "identity",
        "jobs",
        "orders",
        "redirects",
        "search",
        "templates"
      ],
      "networks": [
        "lab"
      ]
    },
    "archives": {
      "build": {
        "context": "https://github.com/sainath1204/cr-multirepo-lab-archives.git#eafed076d9c27c6fe86060b65d7b94bb1cc0bfe9"
      },
      "networks": [
        "lab"
      ]
    },
    "fetch": {
